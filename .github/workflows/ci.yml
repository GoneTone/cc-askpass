name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      # One platform failing still shows the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # validate and test need no login; they run the test kit in-process.
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate .
      - run: claude plugin test .
      - if: runner.os != 'Windows'
        run: sh tests/askpass.sh
      - if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/win.ps1
      # The ssh tests start their own sshd as the runner user.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - if: runner.os != 'Windows'
        run: sh tests/ssh.sh
