name: CI

on:
  # Branches run once, through their pull request; master runs on every push.
  push:
    branches: [master]
  pull_request:
  # release.yml runs the whole CI through workflow_call as the gate before a release.
  workflow_call:

jobs:
  test:
    strategy:
      # One platform failing still shows the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # validate and test need no login; they run the test kit in-process.
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate .
      - run: claude plugin test .
      # Preinstalled on the Ubuntu runner. Left out, as the scripts mean them: `a= b=` on one line
      # (SC1007), getopts letters passed on unhandled (SC2213), `test -O`, which every sh in use
      # has (SC3067), variables read only to be skipped (SC2034) and `"$@"` after `eval set --` (SC2120).
      - if: runner.os == 'Linux'
        run: shellcheck -s sh -S warning -e SC1007,SC2213,SC3067,SC2034,SC2120 bin/askpass bin/exe-of bin/msys-parents bin/remote.sh bin/shim/ssh
      - if: runner.os != 'Windows'
        run: sh tests/askpass.sh
      - if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/win.ps1
      # The ssh tests start their own sshd as the runner user.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - if: runner.os != 'Windows'
        run: sh tests/ssh.sh
